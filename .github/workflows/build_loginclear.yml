name: Build VCLoginClear

on:
  push:
    branches: [ master, main ]
    paths:
      - 'loginclear/**'
      - '.github/workflows/build_loginclear.yml'
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install packaging dependencies
        run: brew install ldid dpkg xz

      - name: Build tweak
        working-directory: loginclear
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Inspect package
        working-directory: loginclear
        run: |
          for package in packages/*.deb; do
            dpkg-deb -I "$package"
            dpkg-deb -c "$package"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vcloginclear-roothide-deb
          path: loginclear/packages/*.deb
          if-no-files-found: error
